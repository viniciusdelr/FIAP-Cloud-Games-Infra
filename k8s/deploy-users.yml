apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-users-deployment
spec:
  selector:
    matchLabels:
      app: api-users
  template:
    metadata:
      labels:
        app: api-users
    spec:
      containers:
      - name: container-api-users
        image: viniciusdelr/users-service:latest 
        imagePullPolicy: Always 
        ports:
        - containerPort: 80 
        resources:
          requests:
            cpu: "100m"   # Reserva mínima (0.1 vCPU)
            memory: "128Mi"
          limits:
            cpu: "250m"   # Teto máximo (0.25 vCPU)
            memory: "256Mi"

        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config  # Nome do arquivo ConfigMap que vamos criar
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__DefaultConnection 
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DatabaseConnection

        - name: JwtSettings__SecretKey 
            secretKeyRef:
              name: app-secrets
              key: JwtSecret
---
apiVersion: v1
kind: Service
metadata:
  name: servico-api-users
spec:
  type: ClusterIP 
  selector:
    app: api-users
  ports:
  - protocol: TCP
    port: 80      
    targetPort: 80 
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-api-users
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-users-deployment
  minReplicas: 1  
  maxReplicas: 10 
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 